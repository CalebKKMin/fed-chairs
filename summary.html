<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>핵심 요약 정리 — 미국 연방준비제도 의장 아카이브</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #ffffff;
    --bg2: #f5f4f0;
    --bg3: #eeece6;
    --text: #1a1a18;
    --text2: #5c5b56;
    --text3: #9c9a92;
    --border: rgba(0,0,0,0.12);
    --border2: rgba(0,0,0,0.22);
    --radius: 12px;
    --radius-sm: 8px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1a;
      --bg2: #252523;
      --bg3: #2e2e2b;
      --text: #e8e6de;
      --text2: #9c9a92;
      --text3: #6a6865;
      --border: rgba(255,255,255,0.10);
      --border2: rgba(255,255,255,0.20);
    }
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif;
    background: var(--bg3);
    color: var(--text);
    line-height: 1.6;
    padding: 2rem 1rem 4rem;
  }

  .page { max-width: 780px; margin: 0 auto; }

  .nav-bar { margin-bottom: 1.2rem; }

  .nav-back {
    display: inline-block;
    font-size: 13px;
    color: var(--text2);
    text-decoration: none;
    padding: 6px 14px;
    background: var(--bg);
    border: 0.5px solid var(--border);
    border-radius: var(--radius-sm);
    transition: border-color 0.2s, color 0.2s;
  }

  .nav-back:hover { border-color: var(--border2); color: var(--text); }

  .page-header {
    margin-bottom: 2rem;
    padding: 2rem;
    background: var(--bg);
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
  }

  .page-header h1 { font-size: 22px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
  .page-header p { font-size: 14px; color: var(--text2); line-height: 1.7; }

  .summary-box {
    margin-top: 1.2rem;
    padding: 1rem 1.2rem;
    background: var(--bg2);
    border-radius: var(--radius-sm);
    font-size: 13px;
    color: var(--text2);
    line-height: 1.75;
  }

  .summary-box strong { color: var(--text); font-weight: 500; }
  .summary-box a { color: var(--text2); }

  .chair-card {
    background: var(--bg);
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 12px;
    overflow: hidden;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .chair-card:hover { border-color: var(--border2); }
  .chair-card.open { border-color: var(--border2); box-shadow: 0 2px 12px rgba(0,0,0,0.06); }

  .chair-header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 15px 18px;
    cursor: pointer;
    user-select: none;
  }

  .era-dot {
    width: 42px; height: 42px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 600;
    flex-shrink: 0;
    letter-spacing: -0.5px;
  }

  .chair-meta { flex: 1; min-width: 0; }
  .chair-name { font-size: 15px; font-weight: 500; color: var(--text); }
  .chair-term { font-size: 12px; color: var(--text2); margin-top: 2px; }

  .chair-tag {
    font-size: 11px; padding: 3px 10px; border-radius: 999px;
    white-space: nowrap; flex-shrink: 0; font-weight: 500;
  }

  .chevron {
    font-size: 18px; color: var(--text3);
    flex-shrink: 0; transition: transform 0.25s; line-height: 1;
  }

  .chair-card.open .chevron { transform: rotate(180deg); }

  .chair-body {
    display: none;
    padding: 0 18px 18px;
    border-top: 0.5px solid var(--border);
  }

  .chair-card.open .chair-body { display: block; }

  .section-label {
    font-size: 11px; font-weight: 600; color: var(--text3);
    text-transform: uppercase; letter-spacing: 0.06em; margin: 16px 0 8px;
  }

  .bullet-list {
    list-style: none;
    padding: 0; margin: 0;
    display: flex; flex-direction: column; gap: 4px;
  }

  .bullet-list li {
    font-size: 13.5px;
    color: var(--text2);
    line-height: 1.68;
    padding-left: 16px;
    position: relative;
  }

  .bullet-list li::before {
    content: '·';
    position: absolute;
    left: 4px;
    color: var(--text3);
    font-weight: 700;
  }

  .eval-quote {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    padding: 10px 14px;
    background: var(--bg2);
    border-radius: var(--radius-sm);
    border-left: 2.5px solid var(--border2);
    margin-bottom: 10px;
    line-height: 1.45;
  }

  .c1  { background: #EEF2FF; color: #3730A3; }
  .c1t { background: #E0E7FF; color: #312E81; }
  .c2  { background: #FEF3C7; color: #78350F; }
  .c2t { background: #FDE68A; color: #713400; }
  .c3  { background: #ECFDF5; color: #065F46; }
  .c3t { background: #D1FAE5; color: #064E3B; }
  .c4  { background: #FFF7ED; color: #9A3412; }
  .c4t { background: #FED7AA; color: #7C2D12; }
  .c5  { background: #F5F3FF; color: #4C1D95; }
  .c5t { background: #EDE9FE; color: #3B0764; }
  .c6  { background: #FDF2F8; color: #831843; }
  .c6t { background: #FCE7F3; color: #701A75; }
  .c7  { background: #ECFEFF; color: #164E63; }
  .c7t { background: #CFFAFE; color: #0E7490; }
  .c8  { background: #F0FDF4; color: #14532D; }

  @media (prefers-color-scheme: dark) {
    .c1  { background: #1e1b4b; color: #a5b4fc; }
    .c1t { background: #2e1065; color: #c4b5fd; }
    .c2  { background: #451a03; color: #fcd34d; }
    .c2t { background: #3b1200; color: #fbbf24; }
    .c3  { background: #022c22; color: #6ee7b7; }
    .c3t { background: #014737; color: #34d399; }
    .c4  { background: #431407; color: #fdba74; }
    .c4t { background: #7c2d12; color: #fb923c; }
    .c5  { background: #2e1065; color: #c4b5fd; }
    .c5t { background: #3b0764; color: #d8b4fe; }
    .c6  { background: #500724; color: #f9a8d4; }
    .c6t { background: #831843; color: #fbcfe8; }
    .c7  { background: #083344; color: #67e8f9; }
    .c7t { background: #0e7490; color: #a5f3fc; }
    .c8  { background: #052e16; color: #86efac; }
  }

  .footer { margin-top: 2.5rem; text-align: center; font-size: 12px; color: var(--text3); }
</style>
</head>
<body>
<div class="page">

  <div class="nav-bar">
    <a href="index.html" class="nav-back">← 홈으로</a>
  </div>

  <div class="page-header">
    <h1>핵심 요약 정리</h1>
    <p>5대 마틴부터 11대 파월까지 · 재임 환경 · 주요 정책 및 업적 · 역사적 평가</p>
    <div class="summary-box">
      <strong>이 뷰는 —</strong> 각 의장을 대표하는 <strong>핵심 키워드 한마디</strong>와 간결한 불릿 포인트로 정리한 요약 카드입니다. 상세 분석은 <a href="chairs.html">View 01</a>을 참고하세요.
    </div>
  </div>

  <div id="chairs-container"></div>

  <div class="footer">각 카드를 클릭하면 세부 내용이 펼쳐집니다 · Claude로 작성</div>
</div>

<script>
const chairs = [
  {
    name: "윌리엄 맥체스니 마틴 주니어",
    num: "5대", term: "1951.04 ~ 1970.01 (18년 9개월, 최장수)",
    color: "c2", tagColor: "c2t", tag: "전후 황금기",
    env: ["6·25 전쟁 및 베트남 전쟁", "1960년대 미국 고도 성장기", "정부의 재정지출 확대 요구"],
    policy: ["1951년 연준-재무부 협정 주도", "경기 과열 시 선제적 금리 인상", "통화정책의 기본 틀 정립"],
    evalTitle: "독립성의 아버지",
    eval: ["재무부로부터 연준의 완전한 독립을 이뤄냄", '"파티가 무르익을 때 펀치볼을 치우는 역할"을 정립함']
  },
  {
    name: "아서 번즈",
    num: "6대", term: "1970.02 ~ 1978.01 (8년)",
    color: "c3", tagColor: "c3t", tag: "스태그플레이션",
    env: ["닉슨 쇼크(금태환 정지)", "제1차 오일쇼크", "스태그플레이션 발생"],
    policy: ["닉슨 대통령의 재선 압박에 순응", "물가 상승기에도 통화 완화 지속", "금리 인상 타이밍 실책"],
    evalTitle: "정치에 흔들린 최악의 의장",
    eval: ["중앙은행의 독립성을 스스로 훼손함", "1970년대 미국의 살인적인 장기 인플레이션을 초래했다는 혹평을 받음"]
  },
  {
    name: "폴 볼커",
    num: "7대", term: "1979.08 ~ 1987.08 (8년)",
    color: "c4", tagColor: "c4t", tag: "인플레이션 타도",
    env: ["제2차 오일쇼크", "10%대 중후반의 하이퍼 물가", "미국 경제의 대혼란기"],
    policy: ["기준금리를 최고 연 20%까지 인상", "시중 유동성을 강제로 죄는 강력한 통화주의 정책 감행"],
    evalTitle: "인플레이션 파이터",
    eval: ["경기 침체와 수많은 기업 도산, 살해 협박 속에서도 물가를 완벽히 진압함", "미국 경제의 체질을 바꾸고 연준의 위상을 높임"]
  },
  {
    name: "앨런 그린스펀",
    num: "8대", term: "1987.08 ~ 2006.01 (18년 5개월)",
    color: "c5", tagColor: "c5t", tag: "대완화·IT버블",
    env: ["1987년 블랙 먼데이", "90년대 닷컴 버블 및 IT 혁명", "9·11 테러 / 대완화기(장기 호황)"],
    policy: ["시장 친화적이고 모호한 화법 구사", "위기 때마다 금리를 낮추는 '그린스펀 풋(Greenspan Put)' 조치 활성화"],
    evalTitle: "거장에서 대위기의 씨앗으로",
    eval: ["재임 중에는 경제를 황금기로 이끈 '마에스트로'로 찬사받음", "퇴임 후 2008 금융위기의 원인이 된 저금리·규제 완화 기조로 인해 비판적 재평가를 받음"]
  },
  {
    name: "벤 버냉키",
    num: "9대", term: "2006.02 ~ 2014.01 (8년)",
    color: "c6", tagColor: "c6t", tag: "글로벌 금융위기",
    env: ["2008년 글로벌 금융위기", "대침체(Great Recession)", "자산 및 금융 시스템 붕괴 위기"],
    policy: ["기준금리 0%대 인하", "역사상 최초의 양적완화(QE) 도입", "대공황 이론을 바탕으로 한 파격적 유동성 공급"],
    evalTitle: "대공황을 막아낸 소방수",
    eval: ["전례 없는 정책으로 금융 시스템 붕괴를 막아냄", "이 공로로 2022년 노벨경제학상 수상", "단, 전 세계적 자산 버블을 유발했다는 지적도 상존"]
  },
  {
    name: "재닛 옐런",
    num: "10대", term: "2014.02 ~ 2018.02 (4년)",
    color: "c7", tagColor: "c7t", tag: "정상화·첫 여성의장",
    env: ["금융위기 이후 완만한 회복기", "고용 시장 및 경제 지표 개선기", "최초의 여성 연준의장"],
    policy: ["통화정책 정상화 추진", "양적완화 종료 및 신중한 금리 인상", "정교한 포워드 가이던스(사전 안내)"],
    evalTitle: "소통과 조율의 대가",
    eval: ["양적완화로 풀린 돈을 회수하면서도 시장에 충격을 주지 않고 부드럽게 이끌어낸 온건한 비둘기파의 정석"]
  },
  {
    name: "제롬 파월",
    num: "11대", term: "2018.02 ~ 현재",
    color: "c8", tagColor: "c3t", tag: "팬데믹·인플레이션",
    env: ["미·중 무역전쟁", "COVID-19 팬데믹", "공급망 교란 및 40년 만의 최악 인플레이션", "러-우 전쟁"],
    policy: ["팬데믹 초기 '무제한 양적완화'", "인플레이션 '일시적' 오판 후 대응 지연", "만회를 위한 4연속 '자이언트 스텝(0.75%p 인상)' 등 초긴축 단행"],
    evalTitle: "위기 극복과 실책의 양면",
    eval: ["코로나19 경제 위기를 빠르게 방어한 공이 크지만, 인플레이션 초기 대응 실패라는 실책이 있음", "결과적으로 고강도 긴축을 통해 미국 경제의 연착륙 흐름을 이끌어냄"]
  }
];

function toggle(i) {
  const card = document.getElementById('card-' + i);
  card.classList.toggle('open');
}

function renderBullets(items) {
  return '<ul class="bullet-list">' + items.map(item => `<li>${item}</li>`).join('') + '</ul>';
}

const container = document.getElementById('chairs-container');

chairs.forEach((c, i) => {
  const card = document.createElement('div');
  card.className = 'chair-card';
  card.id = 'card-' + i;

  card.innerHTML = `
    <div class="chair-header" onclick="toggle(${i})">
      <div class="era-dot ${c.color}">${c.num}</div>
      <div class="chair-meta">
        <div class="chair-name">${c.name}</div>
        <div class="chair-term">${c.term}</div>
      </div>
      <span class="chair-tag ${c.tagColor}">${c.tag}</span>
      <span class="chevron">⌄</span>
    </div>
    <div class="chair-body">
      <div class="section-label">재임 환경</div>
      ${renderBullets(c.env)}
      <div class="section-label">주요 정책 및 업적</div>
      ${renderBullets(c.policy)}
      <div class="section-label">역사적 평가</div>
      <div class="eval-quote">"${c.evalTitle}"</div>
      ${renderBullets(c.eval)}
    </div>`;

  container.appendChild(card);
});
</script>
</body>
</html>
